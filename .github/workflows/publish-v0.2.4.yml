name: Test and publish v0.2.4 release (one time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.2.4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-release:
    if: github.repository == 'Boxzhi/fzgysw_water'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source to verify
        uses: actions/checkout@v4
      - name: Syntax validation
        run: python -m compileall -q custom_components/fzgysw_water tests
      - name: Polling and failure regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check manifest and intervals
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('custom_components/fzgysw_water/manifest.json').read_text())
          assert manifest['version'] == '0.2.4'
          values = Path('custom_components/fzgysw_water/const.py').read_text()
          assert 'COORDINATOR_UPDATE_INTERVAL = 6 * 60 * 60' in values
          assert 'BILL_UPDATE_INTERVAL = 12 * 60 * 60' in values
          print('v0.2.4 manifest and intervals OK')
          PY
      - name: Publish official GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.2.4 --repo Boxzhi/fzgysw_water >/dev/null 2>&1; then
            echo "v0.2.4 already published"
            exit 0
          fi
          cat > /tmp/release-notes.md <<'RELEASE_NOTES'
          ## v0.2.4 · 抚州公用水务
          
          ### 查询频率
          - 账户余额：**每 6 小时**查询一次。
          - 历史账单：**每 12 小时**查询一次；若账单请求失败，则在下一轮 6 小时更新时重试。
          - 正常运行情况下约每天 4 次余额请求、2 次账单请求，总计 **6 次接口请求**（不含重启或手动刷新）。
          
          ### 抓取时间
          - 余额和账单传感器继续使用原属性名 `last_successful_fetch`，但分别表示其各自接口最近成功抓取的 UTC 时间。
          - 现有 `luxe-water-card.js` 读取的是账单实体时间，因此不会因余额中间一次刷新而改变。
          
          ### 稳定性与兼容性
          - 账单请求失败不阻断余额成功更新；保留历史账单缓存及其抓取时间。
          - 余额请求失败时保留旧余额及时间；在有缓存账户、账单到期时仍可尝试账单。
          - 重新加载或重启后会重新请求账户和账单，无需持久化数据缓存。
          - 保持原有实体 ID、账单字段、配置方式及 HACS 安装兼容性。
          - 通过 7 个离线回归测试验证独立时间、查询周期、重试和部分失败场景。
          
          ### 升级
          通过 HACS / Marketplace 更新至 **v0.2.4** 后重启 Home Assistant。无需重新添加账户，也无需修改水务卡片或 YAML。
          RELEASE_NOTES
          gh release create v0.2.4 \
            --repo Boxzhi/fzgysw_water \
            --target 92baddb37d9703e61ace8fde92a2d94259a8be36 \
            --title "v0.2.4 · 抚州公用水务" \
            --notes-file /tmp/release-notes.md \
            --latest
