name: Restore original water logo
on:
  push:
    branches: [restore-water-brand]
    paths: [.github/workflows/restore-water-brand.yml]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install Pillow
      - name: Recover and preserve historic logo
        run: |
          git show 0848ea1356d12d738208f4670f1e2c143af60873:icon.png > /tmp/original.png
          test "$(git hash-object /tmp/original.png)" = 2701e375f0102eb11fd1fed7ecf5ce3894f9a753
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          import shutil
          src = Image.open("/tmp/original.png")
          src.load()
          print("Original:", src.size, src.mode)
          root = Path("custom_components/fzgysw_water/brand")
          for size, name in [(256, "icon.png"), (512, "icon@2x.png")]:
              dest = root / name
              if src.size == (size, size):
                  shutil.copyfile("/tmp/original.png", dest)
              else:
                  rgba = src.convert("RGBA")
                  fitted = ImageOps.contain(rgba, (size, size), Image.Resampling.LANCZOS)
                  canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
                  canvas.paste(fitted, ((size-fitted.width)//2, (size-fitted.height)//2))
                  canvas.save(dest, optimize=True)
              with Image.open(dest) as check:
                  check.verify()
              with Image.open(dest) as check:
                  assert check.size == (size, size)
              print(name, size, dest.stat().st_size)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/fzgysw_water/brand
          git commit -m "Restore original Fuzhou water logo with proportional sizing"
          git push origin HEAD:restore-water-brand
